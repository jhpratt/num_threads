name: Build

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore:
      - "**.md"
      - LICENSE-Apache
      - LICENSE-MIT
  pull_request:
    paths-ignore:
      - "**.md"
      - "**/LICENSE-Apache"
      - "**/LICENSE-MIT"
      - .github/FUNDING.yml
      - .editorconfig
      - .gitignore

jobs:
  check:
    name: Type checking (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.host }}
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) || github.event_name == 'push' }}
    strategy:
      matrix:
        target:
          - name: Linux
            triple: x86_64-unknown-linux-gnu
            host: ubuntu-latest
          - name: Android
            triple: aarch64-linux-android
            host: ubuntu-latest
          - name: macOS
            triple: x86_64-apple-darwin
            host: macos-latest
          - name: iOS
            triple: aarch64-apple-ios
            host: macos-latest
          - name: FreeBSD
            triple: x86_64-unknown-freebsd
            host: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.54.0
        with:
          targets: ${{ matrix.target.triple }}

      - name: Cache cargo output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}

      - name: Type checking
        run: cargo check --target ${{ matrix.target.triple }}

  test:
    name: Test (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.host }}
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) || github.event_name == 'push' }}
    strategy:
      matrix:
        target:
          - name: Linux
            host: ubuntu-latest
          - name: macOS
            host: macos-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo output
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -- --test-threads=1

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) || github.event_name == 'push' }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) || github.event_name == 'push' }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo output
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
